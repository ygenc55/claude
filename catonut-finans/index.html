<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile app shell — sticky header, one scrolling view per tab, bottom tab bar, bottom sheets for forms */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#EAECF4; --line:#DADDEA;
  --fg:#161A2C; --muted:#5F6580; --accent:#3346D3; --accent-soft:#E3E7FF; --on-accent:#FFFFFF;
  --inc:#13845F; --inc-soft:#DDF3EA; --exp:#C93A3A; --exp-soft:#FBE3E3; --warn:#B06A00; --warn-soft:#FFF0D6;
  --shadow:0 1px 2px rgba(22,26,44,.06),0 8px 24px rgba(22,26,44,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1120; --surface:#181B2E; --surface-2:#222640; --line:#2E3352;
  --fg:#ECEEF8; --muted:#9AA0BD; --accent:#8C9BFF; --accent-soft:#262C55; --on-accent:#0F1120;
  --inc:#4CCB9A; --inc-soft:#163428; --exp:#FF7B7B; --exp-soft:#3A1C22; --warn:#F2B04A; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B2E; --surface-2:#222640; --line:#2E3352;
  --fg:#ECEEF8; --muted:#9AA0BD; --accent:#8C9BFF; --accent-soft:#262C55; --on-accent:#0F1120;
  --inc:#4CCB9A; --inc-soft:#163428; --exp:#FF7B7B; --exp-soft:#3A1C22; --warn:#F2B04A; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--fg)}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px 16px}
.banner{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--fg)}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 10px;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{padding:20px 18px;background:var(--accent);color:var(--on-accent);border-radius:18px}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 10px}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:var(--inc-soft);color:var(--inc)} .pill.bad{background:var(--exp-soft);color:var(--exp)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.neu{background:var(--surface-2);color:var(--muted)}
.hero .pill{background:rgba(255,255,255,.18);color:inherit}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:21px;margin-top:4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button span.d{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:16px;font-weight:700}
.d.inc{background:var(--inc-soft);color:var(--inc)} .d.exp{background:var(--exp-soft);color:var(--exp)} .d.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font-size:12px}
.item .a{font-weight:700;white-space:nowrap}
.a.inc{color:var(--inc)} .a.exp{color:var(--exp)}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex:none;display:grid;place-items:center;font-weight:700;color:var(--muted);font-family:var(--f-display)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.bar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--exp)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gi{fill:var(--inc)} .chart .ge{fill:var(--exp)} .chart .grid{stroke:var(--line)} .chart .zero{stroke:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
.kv .strong{font-weight:800;color:var(--fg)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 12px}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.6fr .8fr 1fr auto;gap:6px;align-items:end}
.three input{padding:9px 8px;font-size:15px}
.hint{font-size:12px;color:var(--muted)}
.photo{display:flex;gap:10px;align-items:center}
.photo img{width:72px;height:72px;border-radius:12px;object-fit:cover}
.calc{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.prices div{background:var(--surface-2);border-radius:11px;padding:10px;text-align:center;min-width:0}
.prices div.hl{background:var(--accent);color:var(--on-accent)}
.prices b{display:block;font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.prices small{font-size:11px;opacity:.8}
.ai-box{border:1px dashed var(--accent);border-radius:var(--r);padding:14px;background:var(--accent-soft)}
.ai-box ul{margin:6px 0 0;padding-left:18px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.composer{display:flex;gap:8px}
.composer textarea{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;min-height:46px;max-height:140px;resize:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600}
@media (max-width:360px){.tiles{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TL = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
const TL2 = new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",minimumFractionDigits:2,maximumFractionDigits:2});
const money = (n, fine) => (fine ? TL2 : TL).format(Number.isFinite(n) ? n : 0);
const pct = n => (Number.isFinite(n) ? n : 0).toLocaleString("tr-TR",{maximumFractionDigits:1}) + "%";
function num(v){ if(v==null||v==="") return 0; let s=String(v).trim().replace(/\s|₺|TL/gi,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return Number.isFinite(n)?n:0; }
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${+d} ${MONTHS[+m-1]} ${y}`; };
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }

const CAT_IN = ["Satış","Toptan satış","Diğer gelir"];
const CAT_OUT = ["Hammadde","Kargo","Fason","Ambalaj","Pazaryeri komisyonu","Reklam","Kira","Personel","Fatura / abonelik","Vergi / SGK","Diğer"];
const CARGO = ["Yurtiçi Kargo","Aras Kargo","MNG Kargo","PTT Kargo","Sürat Kargo","HepsiJet","Trendyol Express","Kolay Gelsin"];
const CHANNELS = ["Instagram","Trendyol","Hepsiburada","Etsy","Web sitesi","Toptan / bayi","Elden","Diğer"];

/* ---------- state ---------- */
const DEFAULT_SETTINGS = { name:"Catonut", taxRate:25, vat:20, commission:20, margin:35, entity:"Limited" };
const S = { records:[], settings:{...DEFAULT_SETTINGS}, tab:"ozet", period:"month", txFilter:"all", q:"", loading:true, mode:"local",
  chat:[], ai:null, aiImages:false, assets:null, downloads:null };
const tx = () => S.records.filter(r=>r.kind==="tx");
const products = () => S.records.filter(r=>r.kind==="product");
const customers = () => S.records.filter(r=>r.kind==="customer");
const byId = id => S.records.find(r=>r.id===id);

/* ---------- storage: shared db when available, this device otherwise ---------- */
const LKEY="catonut-finans-v1";
const local = {
  load(){ try{ const j=JSON.parse(localStorage.getItem(LKEY)||"{}"); S.records=j.records||[]; S.settings={...DEFAULT_SETTINGS,...(j.settings||{})}; }catch(e){} },
  persist(){ try{ localStorage.setItem(LKEY, JSON.stringify({records:S.records, settings:S.settings})); }catch(e){ toast("Cihaz hafızası dolu, fotoğrafları azaltın"); } }
};
let db=null;
const store = {
  async save(rec){
    const i=S.records.findIndex(r=>r.id===rec.id); if(i>=0) S.records[i]=rec; else S.records.push(rec);
    render();
    if(db){ const {id,...data}=rec; try{ await db.collection("records").doc(id).set(data); }catch(e){ toast("Kaydedilemedi: "+(e.message||e.code)); } }
    else local.persist();
  },
  async remove(id){
    S.records=S.records.filter(r=>r.id!==id); render();
    if(db){ try{ await db.collection("records").doc(id).delete(); }catch(e){ toast("Silinemedi"); } } else local.persist();
  },
  async saveSettings(){
    render();
    if(db){ try{ await db.doc("settings/main").set(S.settings); }catch(e){ toast("Ayarlar kaydedilemedi"); } } else local.persist();
  }
};

async function boot(){
  local.load(); render();
  const c = window.claude;
  if(!c || !c.use){ S.loading=false; render(); return; }
  const timer=setTimeout(()=>{ if(S.loading){ S.loading=false; render(); } },10000);
  c.use("db").then(d=>{
    if(!d){ clearTimeout(timer); S.loading=false; render(); return; }
    db=d; S.mode="db";
    let first=true;
    db.collection("records").onSnapshot(snap=>{
      S.records=snap.docs.map(x=>({id:x.id,...x.data()}));
      if(first){ first=false; clearTimeout(timer); S.loading=false; }
      render();
    }, e=>{ clearTimeout(timer); S.loading=false; db=null; S.mode="local"; local.load(); render(); toast("Bulut kaydına erişilemedi; veriler bu cihazda tutuluyor"); });
    db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ S.settings={...DEFAULT_SETTINGS,...s.data()}; render(); } }, ()=>{});
  }).catch(()=>{ clearTimeout(timer); S.loading=false; render(); });
  c.use("sample").then(async s=>{ S.ai=s; if(s){ const caps=await s.limits().catch(()=>null); S.aiImages=!!(caps&&caps.images); } render(); }).catch(()=>{});
  c.use("assets").then(a=>{ S.assets=a; }).catch(()=>{});
  c.use("downloads").then(d=>{ S.downloads=d; render(); }).catch(()=>{});
}

/* ---------- money math ---------- */
const netOf = r => r.amount/(1+(r.vat||0)/100);
const vatOf = r => r.amount - netOf(r);
function periodRange(p){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const iso=(Y,M,D)=>`${Y}-${String(M+1).padStart(2,"0")}-${String(D).padStart(2,"0")}`;
  if(p==="month") return [iso(y,m,1), iso(y,m,31), "Bu ay"];
  if(p==="last"){ const d=new Date(y,m-1,1); return [iso(d.getFullYear(),d.getMonth(),1), iso(d.getFullYear(),d.getMonth(),31), "Geçen ay"]; }
  if(p==="quarter"){ const q=Math.floor(m/3)*3; return [iso(y,q,1), iso(y,q+2,31), `${Math.floor(m/3)+1}. çeyrek (geçici vergi dönemi)`]; }
  if(p==="year") return [iso(y,0,1), iso(y,11,31), `${y} yılı`];
  return ["0000","9999","Tüm zamanlar"];
}
function summarize(list){
  const o={inGross:0,inNet:0,outGross:0,outNet:0,vatOut:0,vatIn:0,byCat:{},cargo:{n:0,sum:0,count:0},fason:{sum:0,qty:0},count:list.length};
  for(const r of list){
    const net=netOf(r), v=vatOf(r);
    if(r.type==="gelir"){ o.inGross+=r.amount; o.inNet+=net; o.vatOut+=v; }
    else { o.outGross+=r.amount; o.outNet+=net; o.vatIn+=v; o.byCat[r.cat]=(o.byCat[r.cat]||0)+net;
      if(r.cat==="Kargo"){ o.cargo.sum+=net; o.cargo.count+=(r.qty||1); }
      if(r.cat==="Fason"){ o.fason.sum+=net; o.fason.qty+=(r.qty||0); } }
  }
  o.profit=o.inNet-o.outNet;
  o.vatDue=o.vatOut-o.vatIn;
  o.tax=Math.max(0,o.profit)*(S.settings.taxRate/100);
  o.after=o.profit-o.tax;
  o.margin=o.inNet? o.profit/o.inNet*100 : 0;
  return o;
}
function inPeriod(p){ const [a,b]=periodRange(p); return tx().filter(r=>r.date>=a && r.date<=b); }

function productCalc(p){
  const mats=(p.inputs||[]).reduce((s,i)=>s+num(i.qty)*num(i.price),0);
  const unit=mats+num(p.fason)+num(p.pack)+num(p.cargo)+num(p.other);
  const comm=num(p.commission)/100, mar=num(p.margin)/100, vat=num(p.vat)/100;
  const div=Math.max(0.05,1-comm-mar), divMin=Math.max(0.05,1-comm), divPrem=Math.max(0.05,1-comm-mar-0.15);
  const net=unit/div, min=unit/divMin, prem=unit/divPrem;
  const res={mats,unit,suggestNet:net,suggest:net*(1+vat),min:min*(1+vat),prem:prem*(1+vat)};
  if(num(p.price)>0){ const pn=num(p.price)/(1+vat); res.curProfit=pn-pn*comm-unit; res.curMargin=pn? res.curProfit/pn*100:0; }
  return res;
}

/* ---------- photos ---------- */
function compress(file, max=1280, q=.78){
  return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?res({blob:b,canvas:c}):rej(new Error("Fotoğraf okunamadı")),"image/jpeg",q); };
    img.onerror=()=>rej(new Error("Bu dosya fotoğraf olarak açılamadı")); img.src=u; });
}
async function storePhoto(file){
  const {blob,canvas}=await compress(file);
  if(S.assets){ try{ const a=await S.assets.upload(blob); return {ref:{id:a.id,url:a.url},blob}; }catch(e){} }
  const small=document.createElement("canvas"); const k=Math.min(1,560/Math.max(canvas.width,canvas.height));
  small.width=Math.round(canvas.width*k); small.height=Math.round(canvas.height*k); small.getContext("2d").drawImage(canvas,0,0,small.width,small.height);
  return {ref:{data:small.toDataURL("image/jpeg",.7)},blob};
}
const photoSrc = ref => !ref ? "" : ref.url ? (ref.url.startsWith("https://")||ref.url.startsWith("/_blob/")? ref.url : "/_blob/"+ref.id) : (ref.data && ref.data.startsWith("data:image/") ? ref.data : "");
async function photoBlob(ref){ try{ const src=photoSrc(ref); if(!src) return null; const r=await fetch(src); return await r.blob(); }catch(e){ return null; } }

function monthChart(){
  const n=new Date(); const months=[];
  for(let i=5;i>=0;i--){ const d=new Date(n.getFullYear(),n.getMonth()-i,1); const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const s=summarize(tx().filter(r=>r.date&&r.date.startsWith(key))); months.push({l:MONTHS[d.getMonth()],i:s.inNet,o:s.outNet,p:s.profit}); }
  const max=Math.max(1,...months.map(m=>Math.max(m.i,m.o)));
  const W=340,H=170,top=14,bot=30,base=H-bot,ch=base-top,gw=W/6,bw=Math.min(16,gw/3.2);
  let g="";
  [0,.5,1].forEach(t=>{ const y=base-ch*t; g+=`<line class="grid" x1="0" x2="${W}" y1="${y}" y2="${y}" stroke-dasharray="${t?"2 4":""}"/>`; });
  months.forEach((m,k)=>{ const cx=gw*k+gw/2; const hi=ch*m.i/max, ho=ch*m.o/max;
    g+=`<rect class="gi" x="${cx-bw-1}" y="${base-hi}" width="${bw}" height="${Math.max(hi,0)}" rx="3"/>`;
    g+=`<rect class="ge" x="${cx+1}" y="${base-ho}" width="${bw}" height="${Math.max(ho,0)}" rx="3"/>`;
    g+=`<text x="${cx}" y="${H-14}" text-anchor="middle">${m.l}</text>`;
    g+=`<text x="${cx}" y="${H-1}" text-anchor="middle" style="fill:${m.p>=0?"var(--inc)":"var(--exp)"};font-weight:700">${m.i||m.o? (m.p>=0?"+":"−")+compact(Math.abs(m.p)) : "–"}</text>`; });
  g+=`<text x="${W}" y="${top-3}" text-anchor="end">${compact(max)} ₺</text>`;
  return `<svg class="chart" viewBox="0 -2 ${W} ${H+2}" role="img" aria-label="Son 6 ay gelir ve gider">${g}</svg>
  <div class="legend"><span><i style="background:var(--inc)"></i>Gelir (KDV hariç)</span><span><i style="background:var(--exp)"></i>Gider</span><span>Alt satır: kâr</span></div>`;
}
const compact = n => n>=1e6? (n/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1})+" Mn" : n>=1e3? (n/1e3).toLocaleString("tr-TR",{maximumFractionDigits:1})+" B" : Math.round(n).toLocaleString("tr-TR");

  S.chat.push({role:"user",content:q.trim()}); S.chat.push({role:"assistant",content:"Düşünüyor…"}); S.thinking=true; render();

  const msgs=S.chat.slice(0,-1).map((m,i)=>({role:m.role,content: i===0? sys+"\n\nSoru: "+m.content : m.content}));
  const out=S.chat[S.chat.length-1];
  try{ const r=await S.ai(msgs,{cache:false,onText:({text})=>{ out.content=text; const el=document.querySelectorAll(".msg.b"); if(el.length) el[el.length-1].textContent=text; }}); out.content=r.text; }

}

    T({type:"gelir",cat:"Toptan satış",date:d(m,18),amount:Math.round(22500*k),vat:20,customerId:c2.id,qty:Math.round(40*k),desc:"Örnek: Bayi siparişi"});
    T({type:"gider",cat:"Hammadde",date:d(m,3),amount:Math.round(9200*k),vat:20,supplier:"Örnek Tedarik",desc:"Örnek: Sisal ve MDF"});
    T({type:"gider",cat:"Fason",date:d(m,10),amount:Math.round(4200*k),vat:20,qty:Math.round(60*k),supplier:"Örnek Atölye",desc:"Örnek: Montaj işçiliği"});
    T({type:"gider",cat:"Kargo",date:d(m,25),amount:Math.round(3300*k),vat:20,qty:Math.round(60*k),supplier:"Yurtiçi Kargo",desc:"Örnek: Aylık kargo"});
    T({type:"gider",cat:"Kira",date:d(m,1),amount:9000,vat:0,desc:"Örnek: Atölye kirası"});
    T({type:"gider",cat:"Reklam",date:d(m,12),amount:Math.round(2500*k),vat:20,supplier:"Meta",desc:"Örnek: Instagram reklamı"});
  }
  return recs;
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(!b) return; S.tab=b.dataset.tab; S.q=""; render(); window.scrollTo(0,0); });
$("#addBtn").onclick=()=>newTx("gelir");
$("#setBtn").onclick=settingsForm;
function newTx(type,cat){ txForm({id:uid(),kind:"tx",type,cat:cat||(type==="gelir"?"Satış":"Hammadde"),date:today(),vat:S.settings.vat,amount:0}); }

document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.id==="sheetBg"){ closeSheet(); return; }
  const p=t.closest("[data-period]"); if(p){ S.period=p.dataset.period; render(); return; }
  const f=t.closest("[data-txf]"); if(f){ S.txFilter=f.dataset.txf; render(); return; }
  const ask_=t.closest("[data-ask]"); if(ask_){ ask(ask_.dataset.ask); return; }
  const tt=t.closest("[data-ttype]"); if(tt&&sheetCtx?.kind==="tx"){ const r=readTx(); r.type=tt.dataset.ttype; r.cat=r.type==="gelir"?"Satış":"Hammadde"; txForm(r); return; }
  const ed=t.closest("[data-edit]"); if(ed){ const r=byId(ed.dataset.edit); if(!r) return; if(r.kind==="tx") txForm({...r}); else if(r.kind==="product") productForm(JSON.parse(JSON.stringify(r))); else customerForm({...r}); return; }
  const del=t.closest("[data-del]"); if(del){ if(del.dataset.armed){ await store.remove(del.dataset.del); closeSheet(); toast("Silindi"); } else { del.dataset.armed="1"; del.textContent="Emin misiniz? Sil"; } return; }
  const a=t.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="close") closeSheet();
  else if(act==="new-gelir") newTx("gelir");
  else if(act==="new-gider") newTx("gider");
  else if(act==="new-kargo") newTx("gider","Kargo");
  else if(act==="new-fason") newTx("gider","Fason");
  else if(act==="new-customer") customerForm({id:uid(),kind:"customer",channel:"Instagram"});
  else if(act==="new-product") productForm({id:uid(),kind:"product",inputs:[],vat:S.settings.vat});
  else if(act==="addinput") addInput();
  else if(act==="rminput"){ a.closest("[data-row]").remove(); updCalc(); }
  else if(act==="aiprice") aiPrice(a);
  else if(act==="rmphoto"){ const r=readTx(); r.photo=null; txForm(r); }
  else if(act==="quickcust"){ const r=readTx(); sheetCtx.returnTx=r; customerForm({id:uid(),kind:"customer",channel:"Instagram",_return:r}); }
  else if(act==="demo"){ a.disabled=true; for(const r of demoData()) await store.save(r); toast("Örnek veriler eklendi"); }
  else if(act==="cleardemo"){ for(const r of S.records.filter(x=>x.demo)) await store.remove(r.id); toast("Örnekler silindi"); }
  else if(act==="clearchat"){ S.chat=[]; render(); }
  else if(act==="export-csv") download("csv");
  else if(act==="export-json") download("json");
});

document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="q"){ S.q=e.target.value; render(); return; }
  if(sheetCtx?.kind==="tx"){
    if(id==="f_qty"||id==="f_unit"){ const q=num($("#f_qty").value), u=num($("#f_unit").value); if(q&&u) $("#f_amount").value=(q*u).toFixed(2).replace(".",","); }
    updVat();
  }
  if(sheetCtx?.kind==="product") updCalc();
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="f_vat"||t.id==="p_vat"){ updVat(); updCalc(); }
  if(t.id==="f_cat"&&sheetCtx?.kind==="tx"){ txForm(readTx()); }
  if(t.id==="scanIn"&&t.files[0]) scanReceipt(t.files[0]);
  if(t.id==="f_photo"&&t.files[0]){
    try{ const {ref,blob}=await storePhoto(t.files[0]);
      if(sheetCtx.kind==="tx"){ const r=readTx(); r.photo=ref; txForm(r); }
      else if(sheetCtx.kind==="product"){ const p=readProduct(); p.photo=ref; const ai=sheetCtx.rec.ai; productForm({...p,ai}); sheetCtx.photoBlob=blob; }
    }catch(err){ toast(err.message||"Fotoğraf eklenemedi"); }
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const id=e.target.id;
  if(id==="chatForm"){ const v=$("#chatIn").value; ask(v); return; }
  if(id==="txForm"){ const r=readTx(); if(!r.amount){ toast("Tutar girin"); $("#f_amount").focus(); return; } if(!r.created) r.created=Date.now(); await store.save(r); closeSheet(); toast(r.type==="gelir"?"Satış kaydedildi":"Gider kaydedildi"); }
  if(id==="custForm"){ const c={...sheetCtx.rec}; const back=c._return; delete c._return; const g=x=>document.getElementById(x).value.trim();
    c.name=g("c_name"); c.phone=g("c_phone"); c.city=g("c_city"); c.channel=g("c_ch"); c.taxNo=g("c_tax"); c.note=g("c_note");
    if(!c.name){ toast("Ad girin"); return; } await store.save(c); toast("Müşteri kaydedildi");
    if(back){ back.customerId=c.id; txForm(back); } else closeSheet(); }
  if(id==="prodForm"){ const p=readProduct(); if(!p.name){ toast("Ürün adı girin"); return; } if(sheetCtx.rec.ai) p.ai=sheetCtx.rec.ai; await store.save(p); closeSheet(); toast("Ürün kaydedildi"); }
  if(id==="setForm"){ const g=x=>document.getElementById(x).value; S.settings={...S.settings,name:g("s_name").trim()||"Catonut",entity:g("s_ent"),taxRate:num(g("s_tax")),vat:num(g("s_vat")),commission:num(g("s_comm")),margin:num(g("s_margin"))}; await store.saveSettings(); closeSheet(); toast("Ayarlar kaydedildi"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetCtx) closeSheet(); if(e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(e.target.value); } });

boot();
</script>
